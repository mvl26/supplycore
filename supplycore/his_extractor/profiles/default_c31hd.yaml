name: default/c31-hd
slip_type: transfer
backend: ocr           # vision | ocr — mặc định ocr (offline, không cần API key)
render_dpi: 200
prompt: |
  Đây là ảnh các trang của 1 PHIẾU XUẤT ĐIỀU CHUYỂN kho (Mẫu số C31-HD) từ phần mềm HIS bệnh viện. Hãy đọc CHÍNH XÁC TUYỆT ĐỐI và trả về JSON theo schema.

  Các trường ở đầu phiếu:
  - "Số:" → slip_no (vd PX050626-00021923)
  - "Ngày ... tháng ... năm ..." → slip_date dạng DD/MM/YYYY
  - "Kho điều chuyển:" → from_warehouse_name (kho nguồn)
  - "Kho nhận:" → to_warehouse_name (kho đích)

  Bảng vật tư có các cột: TT | Tên/nhãn hiệu/quy cách | Mã số | Đơn vị tính | Số lô | Hạn sử dụng | Số lượng | Đơn giá | Thành tiền.
  Map sang: tt | name | his_code | uom | batch_no | expiry | qty | unit_price | amount.

  QUY TẮC BẮT BUỘC:
  1. Định dạng số Việt Nam: dấu "." là phân tách hàng nghìn, dấu "," là thập phân. Trả về số thuần: "2.300" → 2300 ; "2.099,99" → 2099.99 ; "379,12" → 379.12 ; "180.824,59" → 180824.59. KHÔNG giữ dấu phân tách.
  2. Một số ô bị xuống dòng (vd Mã số "2025GE24" và "0" ở 2 dòng) — hãy GHÉP LẠI thành 1 giá trị ("2025GE240"). Tên vật tư dài nhiều dòng cũng ghép thành 1 chuỗi.
  3. Mỗi dòng TT là 1 phần tử trong "lines". Nếu cùng Mã số nhưng khác Số lô thì là 2 dòng riêng — giữ nguyên.
  4. KHÔNG đọc dòng "Tổng tiền"/"Cộng khoản" thành 1 item.
  5. Ô trống: chuỗi → "" , số → 0.
  6. Giữ nguyên Số lô đúng như in (kể cả số 0 đứng đầu, vd "0126", "020126").

  Trả về JSON đúng schema, không thêm chú thích.
schema:
  type: object
  additionalProperties: false
  properties:
    slip_no: {type: string}
    slip_date: {type: string}
    from_warehouse_name: {type: string}
    to_warehouse_name: {type: string}
    lines:
      type: array
      items:
        type: object
        additionalProperties: false
        properties:
          tt: {type: integer}
          name: {type: string}
          his_code: {type: string}
          uom: {type: string}
          batch_no: {type: string}
          expiry: {type: string}
          qty: {type: number}
          unit_price: {type: number}
          amount: {type: number}
        required: [tt, name, his_code, uom, batch_no, expiry, qty, unit_price, amount]
  required: [slip_no, slip_date, from_warehouse_name, to_warehouse_name, lines]
ocr:
  header_keywords:
    tt: ["tt"]
    his_code: ["mã"]
    uom: ["vị", "tính"]
    batch_no: ["lô"]
    expiry: ["hạn"]
    qty: ["lượng"]
    unit_price: ["giá"]
    amount: ["tiền"]
