[project]
name = "supplycore"
authors = [
    { name = "SupplyCore Project", email = "info@miyano.com.vn" }
]
description = "Hospital medical supply chain management — custom Frappe/ERPNext v15 app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = [
    # UC-18B: đọc phiếu chuyển kho HIS (PDF ảnh-hoá).
    # Render PDF cần poppler-utils (pdftoppm) ở mức hệ thống.
    "anthropic>=0.40",   # backend 'vision' (Claude API)
    "pytesseract>=0.3",  # backend 'ocr' offline — cần system: tesseract-ocr + tesseract-ocr-vie
]

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"
