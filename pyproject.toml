[project]
name = "supplycore"
authors = [
    { name = "SupplyCore Project", email = "info@miyano.com.vn" }
]
description = "Medical supply distribution management — custom Frappe/ERPNext v15 app"
requires-python = ">=3.10"
readme = "README.md"
dynamic = ["version"]
dependencies = []

[build-system]
requires = ["flit_core >=3.4,<4"]
build-backend = "flit_core.buildapi"

[tool.bench.frappe-dependencies]
frappe = ">=15.0.0"
erpnext = ">=15.0.0"
