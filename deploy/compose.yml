# SupplyCore — single-stack deployment (Frappe Docker style).
# One command brings up DB + Redis + backend + workers + scheduler + websocket
# + nginx frontend, creates the site and installs SupplyCore on first run.
#
# Configure via deploy/.env (see .env.example). Start with:  docker compose up -d
# Open:  http://<host>:${HTTP_PORT:-8080}

x-customizable-image: &customizable_image
  image: ${IMAGE:-ghcr.io/mvl26/supplycore}:${IMAGE_TAG:-latest}
  pull_policy: ${PULL_POLICY:-always}

x-backend-defaults: &backend_defaults
  <<: *customizable_image
  restart: unless-stopped
  volumes:
    - sites:/home/frappe/frappe-bench/sites
    - logs:/home/frappe/frappe-bench/logs

services:
  db:
    image: mariadb:10.6
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --skip-character-set-client-handshake
      - --skip-innodb-read-only-compressed
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-admin}
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -u root -p${DB_PASSWORD:-admin} || exit 1"]
      interval: 10s
      retries: 12
      start_period: 30s
    volumes:
      - db-data:/var/lib/mysql

  redis-cache:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-cache-data:/data

  redis-queue:
    image: redis:6.2-alpine
    restart: unless-stopped
    volumes:
      - redis-queue-data:/data

  configurator:
    <<: *backend_defaults
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        ls -1 apps > sites/apps.txt;
        bench set-config -g db_host $$DB_HOST;
        bench set-config -gp db_port $$DB_PORT;
        bench set-config -g redis_cache "redis://$$REDIS_CACHE";
        bench set-config -g redis_queue "redis://$$REDIS_QUEUE";
        bench set-config -g redis_socketio "redis://$$REDIS_QUEUE";
        bench set-config -gp socketio_port $$SOCKETIO_PORT;
    environment:
      DB_HOST: db
      DB_PORT: "3306"
      REDIS_CACHE: redis-cache:6379
      REDIS_QUEUE: redis-queue:6379
      SOCKETIO_PORT: "9000"
    depends_on:
      db:
        condition: service_healthy
      redis-cache:
        condition: service_started
      redis-queue:
        condition: service_started

  create-site:
    <<: *backend_defaults
    restart: "no"
    entrypoint: ["bash", "-c"]
    command:
      - >
        if [ -d "sites/$$SITE_NAME" ]; then
          echo "Site $$SITE_NAME already exists — skipping creation.";
          exit 0;
        fi;
        wait-for-it -t 120 db:3306;
        wait-for-it -t 120 redis-cache:6379;
        wait-for-it -t 120 redis-queue:6379;
        export start=`date +%s`;
        until [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".db_host // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_cache // empty"` ]] && \
              [[ -n `grep -hs ^ sites/common_site_config.json | jq -r ".redis_queue // empty"` ]];
        do
          echo "Waiting for sites/common_site_config.json to be created…";
          sleep 5;
          if (( `date +%s`-start > 120 )); then
            echo "ERROR: common_site_config.json missing required keys"; exit 1;
          fi
        done;
        echo "Creating site $$SITE_NAME and installing SupplyCore…";
        bench new-site --mariadb-user-host-login-scope='%' \
          --admin-password=$$ADMIN_PASSWORD \
          --db-root-username=root \
          --db-root-password=$$DB_PASSWORD \
          --install-app supplycore \
          --set-default $$SITE_NAME;
    environment:
      SITE_NAME: ${SITE_NAME:-supplycore.localhost}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-admin}
      DB_PASSWORD: ${DB_PASSWORD:-admin}
    depends_on:
      configurator:
        condition: service_completed_successfully

  backend:
    <<: *backend_defaults
    depends_on:
      create-site:
        condition: service_completed_successfully

  websocket:
    <<: *backend_defaults
    command: ["node", "/home/frappe/frappe-bench/apps/frappe/socketio.js"]
    depends_on:
      backend:
        condition: service_started

  queue-short:
    <<: *backend_defaults
    command: ["bench", "worker", "--queue", "short,default"]
    depends_on:
      backend:
        condition: service_started

  queue-long:
    <<: *backend_defaults
    command: ["bench", "worker", "--queue", "long,default,short"]
    depends_on:
      backend:
        condition: service_started

  scheduler:
    <<: *backend_defaults
    command: ["bench", "schedule"]
    depends_on:
      backend:
        condition: service_started

  frontend:
    <<: *customizable_image
    restart: unless-stopped
    command: ["nginx-entrypoint.sh"]
    environment:
      BACKEND: backend:8000
      SOCKETIO: websocket:9000
      FRAPPE_SITE_NAME_HEADER: ${SITE_NAME:-supplycore.localhost}
      UPSTREAM_REAL_IP_ADDRESS: 127.0.0.1
      UPSTREAM_REAL_IP_HEADER: X-Forwarded-For
      UPSTREAM_REAL_IP_RECURSIVE: "off"
      PROXY_READ_TIMEOUT: "120"
      CLIENT_MAX_BODY_SIZE: 50m
    volumes:
      - sites:/home/frappe/frappe-bench/sites
      - logs:/home/frappe/frappe-bench/logs
    depends_on:
      backend:
        condition: service_started
    ports:
      - "${HTTP_PORT:-8080}:8080"

volumes:
  sites:
  logs:
  db-data:
  redis-cache-data:
  redis-queue-data:
