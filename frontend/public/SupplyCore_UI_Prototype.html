<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SupplyCore — Prototype Giao diện theo Persona</title>
<style>
/* ===== DESIGN TOKENS (TL#09 UI Specification) ===== */
:root{
  --primary:#1F4E79; --primary-light:#2E75B6; --primary-dark:#163a5a;
  --bg-light:#E9EFF7; --bg-zebra:#F2F2F2; --danger:#C00000; --warning:#E36C09;
  --success:#375623; --neutral:#7F7F7F; --white:#FFFFFF;
  --line:#d8e0ea; --text:#222; --text-muted:#6a7480;
  --radius:4px; --unit:8px; --shadow:0 2px 4px rgba(0,0,0,.1);
  --shadow-lg:0 6px 18px rgba(15,40,70,.16);
  --font:Arial, "Segoe UI", sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{font-family:var(--font);font-size:14.67px;color:var(--text);background:#cfd8e3;line-height:1.45}
button{font-family:inherit;cursor:pointer}
a{color:var(--primary-light);text-decoration:none}

/* ===== APP SHELL ===== */
.app{display:grid;grid-template-columns:248px 1fr;grid-template-rows:54px 1fr;
  grid-template-areas:"brand top" "side main";height:100vh;overflow:hidden}

/* Brand corner */
.brand{grid-area:brand;background:var(--primary-dark);color:#fff;display:flex;align-items:center;
  gap:10px;padding:0 16px;border-right:1px solid rgba(255,255,255,.08)}
.brand .logo{width:30px;height:30px;border-radius:6px;background:linear-gradient(135deg,#2E75B6,#7fb1e0);
  display:grid;place-items:center;font-weight:800;color:#fff;font-size:16px}
.brand b{font-size:16px;letter-spacing:.3px}
.brand small{display:block;font-size:9.5px;color:#9db8d6;font-weight:400;margin-top:-2px}

/* Topbar */
.topbar{grid-area:top;background:var(--primary);color:#fff;display:flex;align-items:center;
  gap:14px;padding:0 18px}
.topbar .crumb{font-size:13px;color:#cfe0f2}
.topbar .crumb b{color:#fff}
.topbar .spacer{flex:1}
.searchbox{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border-radius:20px;
  padding:6px 14px;width:280px;color:#dce9f7}
.searchbox input{background:transparent;border:none;outline:none;color:#fff;font-size:13px;width:100%}
.searchbox input::placeholder{color:#bcd2ea}
.topbar .ic{position:relative;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;
  background:rgba(255,255,255,.12);font-size:16px}
.topbar .ic .dot{position:absolute;top:-2px;right:-2px;background:var(--danger);color:#fff;font-size:9.5px;
  min-width:16px;height:16px;border-radius:9px;display:grid;place-items:center;padding:0 4px;font-weight:700}
.userchip{display:flex;align-items:center;gap:9px;background:rgba(255,255,255,.1);padding:5px 12px 5px 6px;border-radius:22px}
.userchip .av{width:28px;height:28px;border-radius:50%;background:#7fb1e0;color:#10314f;font-weight:700;
  display:grid;place-items:center;font-size:13px}
.userchip .nm{font-size:12.5px;line-height:1.1}
.userchip .nm small{display:block;color:#bcd2ea;font-size:10px}

/* Sidebar */
.sidebar{grid-area:side;background:var(--white);border-right:1px solid var(--line);display:flex;
  flex-direction:column;overflow:hidden}
.persona-pick{padding:12px;border-bottom:1px solid var(--line);background:var(--bg-light)}
.persona-pick label{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--text-muted);font-weight:700}
.persona-pick select{width:100%;margin-top:6px;padding:9px 10px;border:1px solid #b9c8db;border-radius:var(--radius);
  font-family:inherit;font-size:13px;background:#fff;color:var(--primary);font-weight:700}
.persona-card{padding:11px 12px;display:flex;gap:10px;align-items:flex-start;border-bottom:1px solid var(--line)}
.persona-card .pav{width:40px;height:40px;border-radius:9px;flex:none;display:grid;place-items:center;
  color:#fff;font-weight:800;font-size:15px}
.persona-card .pn{font-size:13.5px;font-weight:700;color:var(--primary)}
.persona-card .pr{font-size:11px;color:var(--text-muted)}
.role-badge{display:inline-block;margin-top:4px;font-size:9.5px;font-weight:700;color:#fff;
  background:var(--primary-light);padding:2px 7px;border-radius:10px;letter-spacing:.3px}
.nav{flex:1;overflow-y:auto;padding:8px 0}
.nav .grp{font-size:9.5px;text-transform:uppercase;letter-spacing:.7px;color:var(--neutral);
  padding:12px 16px 4px;font-weight:700}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 16px;color:#33414f;font-size:13px;
  border-left:3px solid transparent;cursor:pointer}
.nav a .nic{width:18px;text-align:center;opacity:.8}
.nav a:hover{background:var(--bg-light)}
.nav a.active{background:var(--bg-light);border-left-color:var(--primary);color:var(--primary);font-weight:700}
.nav a .tag{margin-left:auto;font-size:9.5px;background:var(--danger);color:#fff;border-radius:9px;
  padding:1px 6px;font-weight:700}
.scope-note{padding:10px 14px;border-top:1px solid var(--line);background:#fbfcfe;font-size:10.5px;color:var(--text-muted)}
.scope-note b{color:var(--success)}

/* Main */
.main{grid-area:main;overflow-y:auto;padding:20px 24px 60px;background:#eef2f7}
.page-head{display:flex;align-items:flex-start;gap:14px;margin-bottom:16px}
.page-head h1{font-size:18px;color:var(--primary)}
.page-head .sub{font-size:12px;color:var(--text-muted);margin-top:2px}
.page-head .scrtag{font-size:10px;background:#dde7f3;color:var(--primary);padding:3px 8px;border-radius:10px;font-weight:700}
.page-head .spacer{flex:1}

/* Buttons */
.btn{border:1px solid transparent;border-radius:var(--radius);padding:8px 14px;font-size:13px;font-weight:600;
  display:inline-flex;align-items:center;gap:7px}
.btn-primary{background:var(--primary);color:#fff}
.btn-primary:hover{background:var(--primary-dark)}
.btn-ghost{background:#fff;border-color:#c2cedd;color:var(--primary)}
.btn-ghost:hover{background:var(--bg-light)}
.btn-success{background:var(--success);color:#fff}
.btn-danger{background:var(--danger);color:#fff}
.btn-warn{background:var(--warning);color:#fff}
.btn-sm{padding:5px 10px;font-size:11.5px}

/* Cards */
.card{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);margin-bottom:16px}
.card>.ct{padding:11px 16px;border-bottom:1px solid var(--line);font-weight:700;color:var(--primary);
  font-size:13px;display:flex;align-items:center;gap:8px}
.card>.ct .spacer{flex:1}
.card>.cb{padding:16px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.row{display:flex;gap:16px;flex-wrap:wrap}

/* KPI tiles */
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);
  padding:14px 16px;border-top:3px solid var(--primary-light);position:relative}
.kpi .k-lbl{font-size:11.5px;color:var(--text-muted);font-weight:600}
.kpi .k-val{font-size:30px;font-weight:800;color:var(--primary);line-height:1.1;margin:4px 0 2px}
.kpi .k-sub{font-size:11px;font-weight:600}
.kpi.warn{border-top-color:var(--warning)} .kpi.warn .k-val{color:var(--warning)}
.kpi.danger{border-top-color:var(--danger)} .kpi.danger .k-val{color:var(--danger)}
.kpi.success{border-top-color:var(--success)} .kpi.success .k-val{color:var(--success)}
.kpi .k-ic{position:absolute;top:12px;right:14px;font-size:18px;opacity:.25}

/* Tables */
table.tbl{width:100%;border-collapse:collapse;font-size:12.5px}
table.tbl th{background:var(--bg-light);color:var(--primary);text-align:left;padding:9px 11px;font-size:11.5px;
  border-bottom:2px solid #d0ddec;white-space:nowrap}
table.tbl td{padding:9px 11px;border-bottom:1px solid #eef1f5;vertical-align:middle}
table.tbl tr:nth-child(even) td{background:var(--bg-zebra)}
table.tbl tr:hover td{background:#eaf1fb}
table.tbl .num{text-align:right;font-variant-numeric:tabular-nums}

/* Badges */
.bdg{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 9px;border-radius:11px}
.bdg.green{background:#e3efe0;color:var(--success)}
.bdg.amber{background:#fcefe0;color:var(--warning)}
.bdg.red{background:#f8e2e2;color:var(--danger)}
.bdg.grey{background:#ececec;color:var(--neutral)}
.bdg.blue{background:#dde9f7;color:var(--primary)}
.dotled::before{content:"●";margin-right:4px}
.stars{color:#E8A800;letter-spacing:1px}

/* Forms */
.fld{margin-bottom:12px}
.fld label{display:block;font-size:11.5px;font-weight:700;color:#41506180;color:var(--text-muted);margin-bottom:4px}
.fld input,.fld select,.fld textarea{width:100%;padding:8px 10px;border:1px solid #c2cedd;border-radius:var(--radius);
  font-family:inherit;font-size:13px;background:#fff}
.fld input:focus,.fld select:focus,.fld textarea:focus{outline:none;border-color:var(--primary-light);box-shadow:0 0 0 2px #2e75b633}
.fld .ro{background:#f4f6f9;color:#444}
.req::after{content:" *";color:var(--danger)}
.help{font-size:10.5px;color:var(--neutral);margin-top:3px}

/* Misc */
.banner{padding:10px 14px;border-radius:var(--radius);font-size:12.5px;margin-bottom:14px;display:flex;align-items:center;gap:9px}
.banner.warn{background:#fcefe0;color:#8a4708;border:1px solid #f0cda0}
.banner.info{background:#e7f0fb;color:#16456f;border:1px solid #bcd6f0}
.banner.ok{background:#e3efe0;color:#2d4a1c;border:1px solid #bcd9ac}
.banner.crit{background:#f8e2e2;color:#7a0000;border:1px solid #e6b3b3}
.bar{height:9px;border-radius:5px;background:#e4eaf1;overflow:hidden;display:inline-block;width:100%;vertical-align:middle}
.bar>span{display:block;height:100%;background:var(--primary-light)}
.bar.full>span{background:var(--success)} .bar.low>span{background:var(--warning)} .bar.crit>span{background:var(--danger)}
.muted{color:var(--text-muted)} .small{font-size:11px} .center{text-align:center} .rt{text-align:right}
.flexsplit{display:grid;grid-template-columns:1fr 1fr;gap:0}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{font-size:11px;background:var(--bg-light);color:var(--primary);padding:4px 10px;border-radius:13px;font-weight:600}

/* Warehouse grid */
.wh-grid{display:flex;flex-direction:column;gap:14px}
.wh-row{display:flex;align-items:center;gap:8px}
.wh-row .rl{width:70px;font-size:11px;font-weight:700;color:var(--text-muted)}
.bin{width:46px;height:34px;border-radius:4px;border:1px solid #c2cedd;display:grid;place-items:center;
  font-size:9.5px;cursor:pointer;color:#56657a;font-weight:700}
.bin.f{background:#cfe0cf;border-color:#9cc09c;color:#2d4a1c}
.bin.h{background:#fae6cc;border-color:#e7bf8e;color:#8a4708}
.bin.e{background:#f1f3f6}
.bin.sel{outline:3px solid var(--primary);outline-offset:1px}

/* PDA mock */
.pda-wrap{display:flex;justify-content:center;padding:6px 0}
.pda{width:320px;background:#0f2333;border-radius:26px;padding:12px;box-shadow:var(--shadow-lg)}
.pda .screen{background:#f4f7fb;border-radius:16px;overflow:hidden}
.pda .pda-top{background:var(--primary);color:#fff;padding:11px 14px;font-weight:700;font-size:13px;display:flex;
  align-items:center;justify-content:space-between}
.pda .pda-body{padding:13px}
.scan-box{border:2px dashed var(--primary-light);border-radius:8px;background:#eaf1fb;padding:18px;text-align:center;
  color:var(--primary);font-weight:700;margin-bottom:12px}
.scan-box .cam{font-size:30px;display:block;margin-bottom:4px}
.pda-item{background:#fff;border:1px solid var(--line);border-radius:8px;padding:11px;margin-bottom:10px;font-size:12.5px}
.pda-item .pi-h{font-weight:700;color:var(--primary);margin-bottom:5px}
.bigbtn{width:100%;padding:13px;border:none;border-radius:8px;background:var(--success);color:#fff;font-weight:800;
  font-size:14px;letter-spacing:.4px}

/* Timeline */
.timeline{position:relative;padding-left:26px}
.timeline::before{content:"";position:absolute;left:8px;top:4px;bottom:4px;width:2px;background:#c9d7e6}
.tl-item{position:relative;margin-bottom:16px}
.tl-item::before{content:"";position:absolute;left:-22px;top:3px;width:12px;height:12px;border-radius:50%;
  background:var(--primary-light);border:2px solid #fff;box-shadow:0 0 0 2px #c9d7e6}
.tl-item.ok::before{background:var(--success)} .tl-item.warn::before{background:var(--warning)} .tl-item.bad::before{background:var(--danger)}
.tl-item .tt{font-weight:700;font-size:12.5px;color:var(--primary)}
.tl-item .tm{font-size:10.5px;color:var(--neutral)}

/* match cols */
.match{display:grid;grid-template-columns:repeat(3,1fr);gap:0;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.match .mc{padding:12px;border-right:1px solid var(--line)}
.match .mc:last-child{border-right:none}
.match .mc h4{font-size:12px;color:var(--primary);margin-bottom:8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
.match .ln{font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}

.checklist .ck{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid #eef1f5;font-size:12.5px}
.checklist .ck .qno{width:22px;height:22px;border-radius:50%;background:var(--bg-light);color:var(--primary);
  display:grid;place-items:center;font-size:11px;font-weight:700;flex:none}
.checklist .ck .qx{flex:1}
.seg{display:inline-flex;border:1px solid #c2cedd;border-radius:6px;overflow:hidden}
.seg button{border:none;background:#fff;padding:5px 12px;font-size:11.5px;font-weight:700;color:#56657a}
.seg button.on-ok{background:var(--success);color:#fff} .seg button.on-no{background:var(--danger);color:#fff}

.footer-note{margin-top:8px;font-size:10.5px;color:var(--neutral);text-align:center}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}.grid2,.grid3{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="app">
  <div class="brand">
    <div class="logo">S</div>
    <div><b>SupplyCore</b><small>Quản lý Cung ứng VTYT</small></div>

  <div class="topbar">

      <thead><tr><th>Vị trí</th><th class="num">SL</th><th>Trạng thái</th></tr></thead>
      <tbody>
        <tr><td>Kho Trung tâm</td><td class="num">200</td><td><span class="bdg green">Đã cách ly</span></td></tr>
        <tr><td>Khoa Cấp cứu</td><td class="num">120</td><td><span class="bdg green">Đã thu hồi</span></td></tr>
        <tr><td>Khoa Nội tổng hợp</td><td class="num">180</td><td><span class="bdg red">Chưa thu hồi</span></td></tr>
      </tbody></table></div></div>
  </div>`
};

/* ============================================================
   ROUTER & KHỞI TẠO
   ============================================================ */
let CUR_PERSONA="lan", CUR_SCREEN=null;

function buildPersonaSelect(){
  const sel=document.getElementById('personaSelect');
  sel.innerHTML=Object.entries(PERSONAS).map(([k,p])=>`<option value="${k}">${p.name} — ${p.role}</option>`).join('');
  sel.value=CUR_PERSONA;
}
function renderSidebar(){
  const p=PERSONAS[CUR_PERSONA];
  document.getElementById('personaCard').innerHTML=
    `<div class="pav" style="background:${p.color}">${p.av}</div>
     <div><div class="pn">${p.name}</div><div class="pr">${p.title}</div><span class="role-badge">${p.role}</span></div>`;
  document.getElementById('nav').innerHTML=p.nav.map(it=>{
    if(it.g) return `<div class="grp">${it.g}</div>`;
    return `<a data-id="${it.id}" onclick="go('${it.id}')"><span class="nic">${it.ic}</span>${it.t}${it.tag?`<span class="tag">${it.tag}</span>`:''}</a>`;
  }).join('');
  document.getElementById('scopeNote').innerHTML=
    `🔒 <b>Phạm vi dữ liệu:</b> ${p.scope}<br>🔑 2FA: ${p.twofa}`;
  // topbar user
  document.getElementById('uav').textContent=p.av;
  document.getElementById('uav').style.background='#7fb1e0';
  document.getElementById('uname').childNodes[0].nodeValue=p.name;
  document.getElementById('urole').textContent=p.role;
  // bell count from nav alert tags
  const alertItem=p.nav.find(n=>n.id&&(n.id.includes('alert')||n.id.includes('quar')||n.id.includes('match')||n.id.includes('batch')));
  document.getElementById('bellCount').textContent=(p.nav.find(n=>n.tag)||{}).tag||"0";
}
function go(id){
  CUR_SCREEN=id;
  const p=PERSONAS[CUR_PERSONA];
  document.querySelectorAll('#nav a').forEach(a=>a.classList.toggle('active',a.dataset.id===id));
  const item=p.nav.find(n=>n.id===id);
  document.getElementById('crumb').innerHTML=`${p.role} › <b>${item?item.t:''}</b>`;
  const fn=SCREENS[id];
  document.getElementById('main').innerHTML=(fn?fn():`<div class="card"><div class="cb">Màn hình đang được thiết kế.</div></div>`)
    + `<div class="footer-note">SupplyCore v1.0 · Prototype giao diện theo persona · Bám sát TL#09 Đặc tả Giao diện & Ma trận Phân quyền RBAC</div>`;
  document.getElementById('main').scrollTop=0;
}
function switchPersona(k){
  CUR_PERSONA=k; renderSidebar(); go(PERSONAS[k].home);
}
function init(){ buildPersonaSelect(); renderSidebar(); go(PERSONAS[CUR_PERSONA].home); }
init();
</script>
</body>
</html>
